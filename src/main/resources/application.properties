#Precedence
##.properties > config maps > secrets > env > env var > java proper
#quarkus.servlet.context-path=/appoinment
quarkus.http.host=0.0.0.0
quarkus.http.cors=true
quarkus.http.cors.origins=*

quarkus.log.level = INFO
quarkus.log.category."org.apache.kafka.clients".level = DEBUG

example.debug-flag = true
example.unit = yard

#Tuple, inicio de dia 8:00
schedule.config.hour.init.minutes=480

#quarkus.hibernate-orm.enabled=true

POSTGRESQL_URL=jdbc:postgresql://${POSTGRESQL_IP}:${POSTGRESQL_PORT}/${POSTGRESQL_DBNAME}
quarkus.datasource.username=${POSTGRESQL_USERNAME}
quarkus.datasource.password=${POSTGRESQL_PASSWORD}
quarkus.datasource.jdbc.url=${POSTGRESQL_URL}
quarkus.hibernate-orm.log.sql=true

quarkus.http.access-log.enabled=true
quarkus.http.access-log.format=common

