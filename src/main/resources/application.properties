#mp.jwt.verify.publickey.location=${OIDC.SERVER}/realms/quarkus/protocol/openid-connect/certs
mp.jwt.verify.issuer=${OIDC.ISSUER}
mp.jwt.verify.audiences=${OIDC.AUDIENCES}
