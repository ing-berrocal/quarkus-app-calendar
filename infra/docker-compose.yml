services:
  db-appoinment-postgres:
    container_name: pg-appoinment
    image: docker.io/library/postgres:16.2
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: pg-user
      POSTGRES_PASSWORD: admin-postgres
      POSTGRES_DB: document_data
    networks:
      - nt-appoinment
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - appoinment_pgdatabase:/var/lib/postgresql/data      

  keycloak:
  # -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin quay.io/keycloak/keycloak:26.3.1 start-dev
    container_name: kc
    image: quay.io/keycloak/keycloak:26.3.1
    restart: always
    ports:
      - 8090:8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    networks:
      - nt-appoinment
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - appoinment_pgdatabase:/var/lib/postgresql/data      


  appoinment-quarkus:
    #build: .
    #image: quarkus-dev:v1.0
    image: docker.io/dberrocal/document-back:v0.1
    ports:
      - 8020:8020
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://pg:5432/postgres
    networks:
      - nt-appoinment
    depends_on: 
      - db-appoinment-postgres

  #front-vite-react:
  #  build: .
  #  ports:
  #    - 80:80
  #  networks:
  #    - nt-default  

volumes:
  appoinment_pgdatabase:
    #allow_other:

networks:
  nt-appoinment: {}
